<!doctype html>
<html lang="en" class="dark">

    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#05070B" />

    <title>CP Studios — Cinematic Film &amp; 8K Production, Los Angeles</title>
    <meta
      name="description"
      content="CP Studios is an award-winning US cinema house producing 8K commercials, luxury wedding films and editorial fashion campaigns. Book a shoot in under two minutes."
    />

    <meta property="og:type" content="website" />
    <meta property="og:title" content="CP Studios — Cinematic Film &amp; 8K Production" />
    <meta
      property="og:description"
      content="Award-winning US cinema house. 8K commercials, luxury wedding films, editorial fashion campaigns."
    />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- Fonts: 2 variable families (3 files) instead of 5 static families (28 files) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300..700&family=Playfair+Display:ital,wght@0,400..900;1,400..700&display=swap"
    />

    <!-- Warm up the image CDN before React paints the hero -->
    <link rel="preconnect" href="https://images.unsplash.com" crossorigin />
    <link rel="dns-prefetch" href="https://images.unsplash.com" />
  </head>
  <body>
    <div id="root"></div>
    <!-- Test hook: `?raf-shim` keeps animation frames ticking in hidden webviews
         (headless verification, embedded previews). Inert without the flag. -->
    <script>
      if (new URLSearchParams(location.search).has('raf-shim')) {
        // Hidden pages throttle timers to 1Hz, but MessageChannel is exempt —
        // drive queued rAF callbacks through it at ~16ms without clamping.
        var __raf = window.requestAnimationFrame.bind(window)
        var __queue = []
        var __chan = new MessageChannel()
        var __pumping = false
        __chan.port1.onmessage = function () {
          var now = performance.now()
          if (now - __last < 15) { __chan.port2.postMessage(0); return }
          __last = now
          var jobs = __queue
          __queue = []
          __pumping = __queue.length > 0
          for (var i = 0; i < jobs.length; i++) jobs[i](now)
          if (__queue.length) { __chan.port2.postMessage(0) } else { __pumping = false }
        }
        var __last = 0
        window.requestAnimationFrame = function (cb) {
          if (document.visibilityState !== 'hidden') return __raf(cb)
          __queue.push(cb)
          if (!__pumping) { __pumping = true; __chan.port2.postMessage(0) }
          return 0
        }
      }
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
